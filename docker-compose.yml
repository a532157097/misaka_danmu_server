version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: danmu-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-danmuapi_root}
      - MYSQL_DATABASE=${DANMUAPI_DATABASE__NAME:-danmuapi}
      - MYSQL_USER=${DANMUAPI_DATABASE__USER:-danmuapi}
      - MYSQL_PASSWORD=${DANMUAPI_DATABASE__PASSWORD:-danmuapi}
      - TZ=Asia/Shanghai
    volumes:
      - ./db-data:/var/lib/mysql
      - ./config/mysql.cnf:/etc/mysql/conf.d/custom.cnf:ro
    # 不对外暴露 3306，仅通过下方内部网络给 app 使用
    networks:
      - danmu-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  app:
    # 使用本地 Dockerfile 构建镜像。
    build:
      context: .
    # image: l429609201/danmu_api_server:latest # 如果您想使用自己推送的镜像，请取消注释此行并注释掉上面的 'build: .'
    container_name: danmu-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "7768:7768"
    environment:
      # Pydantic-settings 会自动读取这些环境变量
      # 将 PUID/PGID 作为环境变量传递给容器，供 entrypoint.sh 使用
      - PUID=1000
      - PGID=1000
      - UMASK=0022 # 设置文件创建掩码，0022 是一个常见的安全默认值
      - DANMUAPI_SERVER__HOST=0.0.0.0
      - DANMUAPI_SERVER__PORT=7768
      # 数据库配置 - 连接到同 compose 网络内的 mysql 服务
      - DANMUAPI_DATABASE__TYPE=mysql
      - DANMUAPI_DATABASE__HOST=mysql
      - DANMUAPI_DATABASE__PORT=3306
      - DANMUAPI_DATABASE__USER=${DANMUAPI_DATABASE__USER:-danmuapi}
      - DANMUAPI_DATABASE__PASSWORD=${DANMUAPI_DATABASE__PASSWORD:-danmuapi}
      - DANMUAPI_DATABASE__NAME=${DANMUAPI_DATABASE__NAME:-danmuapi}
      # 新增：日志级别配置 (可选值: DEBUG, INFO, WARNING, ERROR)
      # - DANMUAPI_LOG__LEVEL=DEBUG

      # 缓存配置
      # 默认使用 hybrid 模式（内存 L1 + 数据库 L2），无需额外服务
      # 可选后端: memory（纯内存）/ redis / database（纯数据库）/ hybrid（默认）
      # - DANMUAPI_CACHE__BACKEND=redis
      # - DANMUAPI_CACHE__REDIS_URL=redis://:you_password@XXX:XXX:XXX:XXX:6379/6

      # JWT 配置 - 强烈建议在 .env 文件中设置一个强密钥
      #- DANMUAPI_JWT__SECRET_KEY=${JWT_SECRET_KEY:-a_very_secret_key_that_should_be_changed_in_prod}
      # 初始管理员配置
      - DANMUAPI_ADMIN__INITIAL_USER=admin
    volumes:
      # 挂载 config 目录以持久化日志和配置文件。
      - ./config:/app/config
      # [可选] 映射 Docker socket，启用一键重启和更新功能
      # 如果不需要此功能，可以注释掉下面这行
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - danmu-net

networks:
  danmu-net:
    driver: bridge

# 说明：
# - MySQL 数据目录挂载到项目下 ./db-data，不映射宿主机 3306，只在 danmu-net 内给 app 使用。
# - 首次启动会创建空库；表结构由应用启动时自动迁移。
# - 数据库账号密码可通过同目录 .env 覆盖，参见 .env.example。
# - Docker Socket 映射后，可通过 Web 界面一键重启容器；更新仍建议手动 build/up。
