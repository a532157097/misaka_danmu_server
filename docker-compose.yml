version: '3.8'

services:
  mysql:
    # 与已有 ./db-data 的数据字典版本一致（80100=8.1）；勿再用 8.0，否则会报 Cannot downgrade
    image: mysql:8.1
    container_name: danmu-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-danmuapi_root}
      - MYSQL_DATABASE=${DANMUAPI_DATABASE__NAME:-danmuapi}
      - MYSQL_USER=${DANMUAPI_DATABASE__USER:-danmuapi}
      - MYSQL_PASSWORD=${DANMUAPI_DATABASE__PASSWORD:-danmuapi}
      - TZ=Asia/Shanghai
    volumes:
      - ./db-data:/var/lib/mysql
      - ./config/mysql.cnf:/etc/mysql/conf.d/custom.cnf:ro
    # 不对外暴露 3306，仅通过下方内部网络给 app 使用
    networks:
      - danmu-net
    healthcheck:
      # 必须用 CMD-SHELL，密码环境变量才会被展开；CMD 会把 $MYSQL_ROOT_PASSWORD 当成字面密码
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  app:
    # 使用官方镜像，避免自建镜像流控签名校验失败导致无法下载弹幕。
    # 本地修改的自动后备匹配修复通过下面两个文件挂载覆盖进容器。
    image: l429609201/misaka_danmu_server:latest
    # 若必须完全自建镜像，可改回：
    # build:
    #   context: .
    container_name: danmu-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "7768:7768"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=0022
      - DANMUAPI_SERVER__HOST=0.0.0.0
      - DANMUAPI_SERVER__PORT=7768
      - DANMUAPI_DATABASE__TYPE=mysql
      - DANMUAPI_DATABASE__HOST=mysql
      - DANMUAPI_DATABASE__PORT=3306
      - DANMUAPI_DATABASE__USER=${DANMUAPI_DATABASE__USER:-danmuapi}
      - DANMUAPI_DATABASE__PASSWORD=${DANMUAPI_DATABASE__PASSWORD:-danmuapi}
      - DANMUAPI_DATABASE__NAME=${DANMUAPI_DATABASE__NAME:-danmuapi}
      - DANMUAPI_ADMIN__INITIAL_USER=admin
    volumes:
      - ./config:/app/config
      # 覆盖官方镜像中的匹配/下载逻辑（集数偏移修复）
      - ./src/api/dandan/comments.py:/app/src/api/dandan/comments.py:ro
      - ./src/api/dandan/match.py:/app/src/api/dandan/match.py:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - danmu-net

networks:
  danmu-net:
    driver: bridge

# 说明：
# - MySQL 数据目录挂载到项目下 ./db-data，不映射宿主机 3306，只在 danmu-net 内给 app 使用。
# - app 使用官方镜像保证流控配置可验证；本地修复文件通过 bind mount 覆盖。
# - 数据库账号密码可通过同目录 .env 覆盖，参见 .env.example。
# - 拉取官方镜像若超时，可先：
#   docker pull docker.1ms.run/l429609201/misaka_danmu_server:latest
#   docker tag docker.1ms.run/l429609201/misaka_danmu_server:latest l429609201/misaka_danmu_server:latest
